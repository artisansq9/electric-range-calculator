<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>电动车续航计算器 2.0</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "PingFang SC","Microsoft YaHei",sans-serif;
  background:#f3f4f6;
  color:#111827;
}

.container{
  width:min(100%,760px);
  margin:auto;
  padding:12px 14px 40px;
}

.header{
  text-align:center;
  padding:18px 8px 22px;
}

.header h1{
  margin:0;
  font-size:29px;
  font-weight:900;
}

.header p{
  margin:8px 0 0;
  color:#6b7280;
  font-size:14px;
}

.badge{
  display:inline-block;
  margin-top:10px;
  padding:5px 10px;
  border-radius:999px;
  background:#dbeafe;
  color:#1d4ed8;
  font-size:12px;
  font-weight:700;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:14px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.card h2{
  margin:0 0 18px;
  font-size:19px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.field{
  min-width:0;
}

.field.full{
  grid-column:1/-1;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  font-weight:700;
  color:#374151;
}

.input-wrap{
  position:relative;
}

input,
select{
  width:100%;
  height:50px;
  padding:0 58px 0 14px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#fff;
  color:#111827;
  font-size:17px;
  outline:none;
}

select{
  padding-right:14px;
}

input:focus,
select:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.unit{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:#6b7280;
  font-size:13px;
  pointer-events:none;
}

.quick{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.quick button{
  flex:0 0 auto;
  min-height:38px;
  padding:0 13px;
  font-size:13px;
  background:#f3f4f6;
  color:#374151;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

button{
  flex:1;
  min-height:48px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

button:active{
  transform:scale(.99);
}

.primary{
  background:#2563eb;
  color:#fff;
}

.secondary{
  background:#e5e7eb;
  color:#374151;
}

.result-main{
  text-align:center;
  padding:5px 0 18px;
}

.result-label{
  color:#6b7280;
  font-size:14px;
}

.range-value{
  margin:4px 0;
  font-size:52px;
  line-height:1.1;
  font-weight:900;
  color:#2563eb;
}

.range-unit{
  color:#6b7280;
  font-size:16px;
}

.results{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.result-item{
  padding:14px;
  background:#f9fafb;
  border-radius:14px;
}

.result-item .name{
  color:#6b7280;
  font-size:13px;
  margin-bottom:5px;
}

.result-item .value{
  font-size:20px;
  font-weight:850;
}

.formula,
.notice{
  padding:14px;
  border-radius:13px;
  font-size:14px;
  line-height:1.7;
}

.formula{
  background:#eff6ff;
  color:#1e40af;
}

.notice{
  background:#f0fdf4;
  color:#166534;
}

.error{
  display:none;
  margin-top:12px;
  padding:11px 13px;
  border-radius:10px;
  background:#fef2f2;
  color:#b91c1c;
  font-size:13px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13
